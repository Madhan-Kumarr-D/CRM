spring.application.name=backend

# 1. Use localhost and port 1433
# Change 8080 to 1433
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=MADHANDatabase;encrypt=true;trustServerCertificate=true;
  # 2. Credentials

spring.datasource.username=SpringUser
spring.datasource.password=Sandbox@123#

# 3. Driver
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# 4. EXPLICITLY set the Dialect (This fixes your specific error)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# 5. Schema management
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.cassandra.contact-points=127.0.0.1
spring.cassandra.port=9042
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.keyspace-name=madhandatabase